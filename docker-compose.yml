  #     - testnet
  #   restart: unless-stopped
  #   networks:
  #     - aztec-network

  # relayer:
  #   container_name: aztec-wormhole-relayer
  #   profiles:
  #     - testnet
  #   build:
  #     context: ./packages/relayer
  #     dockerfile: Dockerfile
  #   environment:
  #     - LOG_LEVEL=info
  #     - SPY_RPC_HOST=wormhole-spy:7073
