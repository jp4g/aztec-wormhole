services:
  # Wormhole Spy - monitors guardian network for VAAs
  wormhole-spy:
    image: ghcr.io/wormhole-foundation/guardiand:latest
    platform: linux/amd64
    entrypoint: /guardiand
    command:
      - spy
      - --nodeKey
      - /node.key
      - --spyRPC
      - "[::]:7073"
      - --env
      - testnet
    ports:
      - "7073:7073"
    networks:
      - bridge-network

  # Relayer for Aztec -> EVM (listens for Aztec VAAs, submits to Arbitrum)
  relayer-to-evm:
    build:
      context: ./packages/relayer
      dockerfile: Dockerfile
    command: ["evm"]
    environment:
      # Wormhole Spy
      - SPY_RPC_HOST=wormhole-spy:7073
      # Source chain (Aztec)
      - CHAIN_ID=56
      # EVM target
      - EVM_RPC_URL=${ARBITRUM_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      - EVM_TARGET_CONTRACT=${EVM_BRIDGE_ADDRESS}
      - PRIVATE_KEY=${PRIVATE_KEY}
    depends_on:
      - wormhole-spy
    networks:
      - bridge-network
    restart: unless-stopped

  # Relayer for EVM -> Aztec (listens for Arbitrum VAAs, submits to Aztec)
  relayer-to-aztec:
    build:
      context: ./packages/relayer
      dockerfile: Dockerfile
    command: ["aztec"]
    environment:
      # Wormhole Spy
      - SPY_RPC_HOST=wormhole-spy:7073
      # Source chain (Arbitrum Sepolia)
      - CHAIN_ID=10003
      # Aztec target
      - AZTEC_PXE_URL=${L2_NODE_URL:-https://devnet.aztec-labs.com}
      - AZTEC_WALLET_ADDRESS=${AZTEC_RECEIVER_ADDRESS}
      - AZTEC_TARGET_CONTRACT=${AZTEC_BRIDGE_ADDRESS}
      # Optional verification service (if running separately)
      - VERIFICATION_SERVICE_URL=${VERIFICATION_SERVICE_URL:-}
    depends_on:
      - wormhole-spy
    networks:
      - bridge-network
    restart: unless-stopped

networks:
  bridge-network:
    driver: bridge
