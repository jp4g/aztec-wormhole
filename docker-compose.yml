services:
  anvil:
    container_name: anvil-ethereum-node
    profiles:
      - sandbox
    image: aztecprotocol/aztec:latest
    ports:
      - "8545:8545"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        anvil --host 0.0.0.0 --silent
    restart: unless-stopped
    networks:
      - aztec-network

  aztec-sandbox-node:
    container_name: aztec-sandbox-node
    profiles:
      - sandbox
    image: aztecprotocol/aztec:latest
    ports:
      - "8080:8080"
      - "40400:40400"
      - "40400:40400/udp"
    environment:
      - L1_CHAIN_ID=31337
      - ETHEREUM_HOSTS=http://anvil:8545
      - AZTEC_PORT=8080
      - P2P_PORT=40400
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        node --no-warnings /usr/src/yarn-project/aztec/dest/bin/index.js start --sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      - anvil
    restart: unless-stopped
    networks:
      - aztec-network

  # Mock Spy for Local Development (Sandbox)
  mock-spy:
    container_name: wormhole-mock-spy
    profiles:
      - sandbox
    build:
      context: ./packages/mock-spy
      dockerfile: Dockerfile
    ports:
      - "7073:7073"  # gRPC for relayer
      - "8081:8081"  # HTTP for Next.js/test scripts
    environment:
      - LOG_LEVEL=info
      - GRPC_PORT=7073
      - HTTP_PORT=8081
    restart: unless-stopped
    networks:
      - aztec-network

  relayer:
    container_name: aztec-wormhole-relayer
    profiles:
      - sandbox
    build:
      context: ./packages/relayer
      dockerfile: Dockerfile
    environment:
      - LOG_LEVEL=info
      - SPY_RPC_HOST=mock-spy:7073
      - ARBITRUM_RPC_URL=http://anvil:8545
      - DEST_CHAIN_ID=31337
      - SOURCE_CHAIN_ID=56
      - AZTEC_PXE_URL=http://aztec-sandbox-node:8080
    depends_on:
      - mock-spy
      - anvil
      - aztec-sandbox-node
    restart: unless-stopped
    networks:
      - aztec-network

  frontend:
    container_name: aztec-wormhole-frontend
    profiles:
      - sandbox
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_RPC_URL=http://anvil:8545
      - NEXT_PUBLIC_PXE_URL=http://aztec-sandbox-node:8080
      - NEXT_PUBLIC_CONTRACT_ADDRESS=0x009cbB8f91d392856Cb880d67c806Aa731E3d686
      - MOCK_SPY_URL=http://mock-spy:8081
      - PXE_URL=http://aztec-sandbox-node:8080
    depends_on:
      - anvil
      - aztec-sandbox-node
      - mock-spy
    restart: unless-stopped
    networks:
      - aztec-network

  # Real Wormhole Spy + Relayer for Testnet
  # Uncomment these services when you're ready to use testnet

